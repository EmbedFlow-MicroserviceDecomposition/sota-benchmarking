services:
  mysql:
    image: mariadb:10.5
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=spring_blog_prod

  redis:
    image: redis:alpine

  spring-blog:
    container_name: spring-blog-app
    image: eclipse-temurin:8-jre
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/spring_blog_prod?useUnicode=true&characterEncoding=utf8&useSSL=false&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    volumes:
      - ./SpringBlog/build/libs/SpringBlog-0.0.1-SNAPSHOT.jar:/app.jar:ro
      - ../../tools/mono2micro/Mono2Micro-CLI/instrumenter:/minerva:ro
      - ../../tools/mono2micro/outputs/spring-blog/tables:/tables:rw
    command: java -javaagent:/minerva/minerva-agent-1.0.jar=/tables -jar /app.jar --spring.profiles.active=prod --spring.datasource.url=jdbc:mysql://mysql:3306/spring_blog_prod?useUnicode=true&characterEncoding=utf8&useSSL=false&createDatabaseIfNotExist=true --spring.datasource.username=root --spring.datasource.password= --spring.redis.host=redis
    depends_on:
      - mysql
      - redis
