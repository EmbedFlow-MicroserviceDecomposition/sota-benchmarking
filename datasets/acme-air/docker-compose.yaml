version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    ports:
      - "27017:27017"
    networks:
      - acmeair-net

  acmeair-liberty:
    build: .
    ports:
      - "9080:9080"
    environment:
      # JAVA_AGENT unset: Mono2Micro's agent; empty (JAVA_AGENT=): no agent; tools/fosci/record_trace.py sets the FoSCI tracer
      - JVM_ARGS=${JAVA_AGENT--javaagent:/minerva/minerva-agent-1.0.jar=/tables}
      - WLP_LOGGING_CONSOLE_LOGLEVEL=info
    volumes:
      # Mount the Mono2Micro instrumenter and tables output directories
      - ../../tools/mono2micro/Mono2Micro-CLI/instrumenter:/minerva:ro
      - ../../tools/mono2micro/outputs/acme-air/tables:/tables:rw
      - ../../tools/fosci/tracer-agent:/fosci:ro
      - ${TRACE_DIR:-../../tools/fosci/outputs/acme-air/trace}:/trace:rw
    depends_on:
      - mongodb
    networks:
      - acmeair-net

networks:
  acmeair-net:
