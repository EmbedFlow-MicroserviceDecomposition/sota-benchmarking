services:
  spring-petclinic:
    container_name: spring-petclinic-app
    image: eclipse-temurin:8-jre
    ports:
      - "8080:8080"
    volumes:
      - ./spring-petclinic/target/spring-petclinic-1.5.1.jar:/app.jar:ro
      - ../../tools/mono2micro/Mono2Micro-CLI/instrumenter:/minerva:ro
      - ../../tools/mono2micro/outputs/spring-petclinic/tables:/tables:rw
      - ../../tools/fosci/tracer-agent:/fosci:ro
      - ${TRACE_DIR:-../../tools/fosci/outputs/spring-petclinic/trace}:/trace:rw
    # JAVA_AGENT unset: Mono2Micro's agent; empty (JAVA_AGENT=): no agent; tools/fosci/record_trace.py sets the FoSCI tracer
    command: java ${JAVA_AGENT--javaagent:/minerva/minerva-agent-1.0.jar=/tables} -jar /app.jar
