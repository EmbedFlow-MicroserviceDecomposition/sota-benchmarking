services:
  mongodb:
    image: mongo:4.4
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: autocare
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js

  # S3 for the vehicle images: Adobe's S3Mock in place of AWS (MinIO's images are no longer public). S3Mock only does
  # path-style requests, which the app's AWS SDK v1 client uses when the endpoint is an IP address: hence the fixed IP.
  s3mock:
    image: adobe/s3mock:3.11.0
    environment:
      initialBuckets: autocare
    networks:
      default:
        ipv4_address: 172.28.0.10

  autocare:
    container_name: autocare-app
    image: eclipse-temurin:8-jre
    ports:
      - "8080:8080"
    volumes:
      - ./autocare-nepal/build/libs/autocare-0.0.1-SNAPSHOT.jar:/app.jar:ro
      - ../../tools/mono2micro/Mono2Micro-CLI/instrumenter:/minerva:ro
      - ../../tools/mono2micro/outputs/autocare/tables:/tables:rw
      - ../../tools/fosci/tracer-agent:/fosci:ro
      - ${TRACE_DIR:-../../tools/fosci/outputs/autocare/trace}:/trace:rw
    # JAVA_AGENT unset: Mono2Micro's agent; empty (JAVA_AGENT=): no agent; tools/fosci/record_trace.py sets the FoSCI tracer
    command: >
      java ${JAVA_AGENT--javaagent:/minerva/minerva-agent-1.0.jar=/tables} -jar /app.jar
      --spring.data.mongodb.host=mongodb --aws.access-key=autocare-access-key --aws.access-secret=autocare-secret-key
      --aws.s3.base-url=http://172.28.0.10:9090 --aws.s3.region=us-east-1 --aws.s3.bucket-name=autocare
    depends_on:
      mongodb:
        condition: service_started
      s3mock:
        condition: service_started

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
